{% load i18n %}


{% partialdef btn-link %}
  <a
      id="{{ id }}"
      href="{{ href }}"
      class="wizard-btn"
  >
      {% translate label %}
  </a>
{% endpartialdef %}


{% partialdef btn-submit %}
  <button
      id="{{ id }}"
      type="submit"
      {% if form_id %}form="{{ form_id }}"{% endif %}
      class="wizard-btn"
  >
      {% translate label %}
  </button>
{% endpartialdef %}
